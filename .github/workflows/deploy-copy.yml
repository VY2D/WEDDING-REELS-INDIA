name: Deploy copy

on:
  push:
    paths:
      - .github/workflows/deploy-copy.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy uploaded file over index.html
        run: cp wedding-reels-india-website.html index.html
      - name: Commit updated index.html
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Deploy updated index.html" || echo "No changes to commit"
          git push
