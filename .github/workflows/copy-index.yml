name: Copy uploaded HTML to index
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/copy-index.yml
permissions:
  contents: write
jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy uploaded file over index.html
        run: cp wedding-reels-india-website.html index.html
      - name: Commit index.html
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Publish updated index.html"
          git push
