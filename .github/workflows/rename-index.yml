name: Replace index.html with corrected file

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace index.html with corrected file
        run: |
          rm -f index.html
          mv wedding-reels-india-website.html index.html
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Replace index.html with corrected vy2d.github.io links" || echo "nothing to commit"
          git push
