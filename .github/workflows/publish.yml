name: Publish updated index

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy uploaded file over index.html
        run: |
          cp wedding-reels-india-website.html index.html
          git config user.name "vishalyadav2929"
          git config user.email "vishalyadav2929@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Publish updated index.html (remove Logo Trial preview)"
          git push
