name: Publish index
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-index.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp wedding-reels-india-website.html index.html
      - run: |
          git config user.name "vishalyadav2929"
          git config user.email "vishalyadav2929@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Publish updated index.html (GitHub Pages URLs)"
          git push




















