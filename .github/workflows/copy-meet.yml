name: Copy meeting page to meet.html

on:
  push:
    branches: [main]
    paths:
      - pranit-nidhi-meeting-surprise.html
  workflow_dispatch:

permissions:
  contents: write

jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy file to meet.html
        run: cp pranit-nidhi-meeting-surprise.html meet.html
      - name: Commit meet.html
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add meet.html
          git diff --cached --quiet || git commit -m "Add meet.html - short copy of meeting page"
          git push
